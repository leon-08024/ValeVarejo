<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrinho — ValeVarejo Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <div id="header-placeholder"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <h1 class="text-3xl font-extrabold mb-2">Meu Carrinho</h1>
    <p class="text-gray-500 mb-8" id="cartCount"></p>
    <div id="cartContent"></div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="../js/app.js"></script>
  <script>
    document.getElementById('header-placeholder').innerHTML = headerHTML('', '../');
    document.getElementById('footer-placeholder').innerHTML = footerHTML('../');

    function renderCart() {
      const content = document.getElementById('cartContent');
      const countEl = document.getElementById('cartCount');

      if (cart.length === 0) {
        content.innerHTML = `
          <div class="text-center py-20">
            <div class="text-7xl mb-6">🛒</div>
            <h3 class="text-2xl font-bold text-gray-700 mb-3">Seu carrinho está vazio</h3>
            <p class="text-gray-500 mb-8 max-w-md mx-auto">Adicione produtos do catálogo para começar suas compras!</p>
            <a href="catalogo.html" class="inline-flex px-8 py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold text-lg transition-all duration-300 active:scale-95 shadow-lg shadow-emerald-200">
              Ver Catálogo →
            </a>
          </div>
        `;
        return;
      }

      countEl.textContent = `${getCartCount()} item(s) no carrinho`;

      const subtotal = getCartTotal();
      const frete = subtotal >= 200 ? 0 : 29.90;
      const total = subtotal + frete;

      content.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <!-- ITENS -->
          <div class="lg:col-span-2 space-y-4">
            ${cart.map(item => {
              const store = getStoreById(item.storeId);
              return `
                <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 flex gap-5">
                  <div class="w-24 h-24 bg-gradient-to-br from-gray-50 to-gray-100 rounded-xl flex items-center justify-center text-4xl shrink-0">
                    ${item.emoji}
                  </div>
                  <div class="flex-1 min-w-0">
                    <h4 class="font-bold text-gray-900 mb-1 truncate">${item.name}</h4>
                    <p class="text-xs text-emerald-600 font-medium mb-2">${store ? store.name : ''}</p>
                    <p class="text-lg font-extrabold text-emerald-700">${formatPrice(item.price)}</p>
                  </div>
                  <div class="flex flex-col items-end justify-between shrink-0">
                    <button onclick="removeItem(${item.id})" class="text-gray-400 hover:text-red-500 transition-colors text-sm font-medium">✕ Remover</button>
                    <div class="inline-flex items-center bg-gray-100 rounded-lg p-0.5">
                      <button onclick="changeItemQty(${item.id}, -1)" class="w-8 h-8 rounded-md bg-white shadow-sm font-bold text-sm text-gray-700 hover:text-emerald-600 transition-colors">−</button>
                      <span class="w-8 text-center font-bold text-sm">${item.qty}</span>
                      <button onclick="changeItemQty(${item.id}, 1)" class="w-8 h-8 rounded-md bg-white shadow-sm font-bold text-sm text-gray-700 hover:text-emerald-600 transition-colors">+</button>
                    </div>
                    <p class="font-bold text-gray-900">${formatPrice(item.price * item.qty)}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>

          <!-- RESUMO -->
          <div class="lg:col-span-1">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 sticky top-36">
              <h3 class="font-bold text-lg mb-5 flex items-center gap-2">
                <span class="w-8 h-8 bg-emerald-100 rounded-lg flex items-center justify-center text-sm">📋</span>
                Resumo do Pedido
              </h3>
              <div class="space-y-3 mb-5">
                <div class="flex justify-between text-sm">
                  <span class="text-gray-500">Subtotal (${getCartCount()} itens)</span>
                  <span class="font-semibold">${formatPrice(subtotal)}</span>
                </div>
                <div class="flex justify-between text-sm">
                  <span class="text-gray-500">Frete</span>
                  <span class="font-semibold ${frete === 0 ? 'text-emerald-600' : ''}">${frete === 0 ? 'Grátis' : formatPrice(frete)}</span>
                </div>
                ${frete > 0 ? '<p class="text-xs text-emerald-600 bg-emerald-50 px-3 py-2 rounded-lg">Frete grátis acima de R$ 200,00</p>' : ''}
              </div>
              <div class="flex justify-between text-lg font-extrabold border-t border-gray-100 pt-4 mb-6">
                <span>Total</span>
                <span class="text-emerald-700">${formatPrice(total)}</span>
              </div>
              <a href="checkout.html" class="block w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-2xl font-bold text-center text-lg transition-all duration-300 active:scale-95 shadow-lg shadow-emerald-200">
                Finalizar Compra
              </a>
              <a href="catalogo.html" class="block w-full py-3 mt-3 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-2xl font-semibold text-center text-sm transition-all duration-300">
                Continuar Comprando
              </a>
            </div>
          </div>
        </div>
      `;
    }

    function removeItem(id) {
      removeFromCart(id);
      renderCart();
    }

    function changeItemQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (item) {
        updateCartQty(id, item.qty + delta);
        renderCart();
      }
    }

    function doSearch() {
      const q = document.getElementById('searchInput').value;
      if (q.trim()) window.location.href = `catalogo.html?q=${encodeURIComponent(q)}`;
    }

    renderCart();
  </script>
</body>
</html>
