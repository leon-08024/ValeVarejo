<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lojas Parceiras — ValeVarejo Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <div id="header-placeholder"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-12">
    <div class="text-center mb-12">
      <span class="text-emerald-600 font-bold text-sm uppercase tracking-wider">Comunidade</span>
      <h1 class="text-3xl md:text-4xl font-extrabold mt-2">Lojas Parceiras</h1>
      <p class="text-gray-500 mt-3 max-w-xl mx-auto">Conheça os artesãos e produtores do Vale do Itajaí que trazem produtos únicos até você.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="storesGrid"></div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="../js/app.js"></script>
  <script>
    document.getElementById('header-placeholder').innerHTML = headerHTML('lojas', '../');
    document.getElementById('footer-placeholder').innerHTML = footerHTML('../');

    const grid = document.getElementById('storesGrid');
    stores.forEach(s => {
      grid.innerHTML += renderStoreCard(s, '../');
    });

    function doSearch() {
      const q = document.getElementById('searchInput').value;
      if (q.trim()) window.location.href = `catalogo.html?q=${encodeURIComponent(q)}`;
    }
  </script>
</body>
</html>
