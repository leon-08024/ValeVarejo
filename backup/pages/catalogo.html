<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo — ValeVarejo Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            emerald: {
              50: '#F0F5F0', 100: '#E0E9DF', 200: '#C2D4BE', 300: '#99B392',
              400: '#6E946B', 500: '#4E7A52', 600: '#3E6F4E', 700: '#31563F',
              800: '#284533', 900: '#223829',
            },
            teal: { 400: '#5F9A8F', 500: '#4A8275', 600: '#39695E' },
            green: { 200: '#CBE0C6', 400: '#6E946B', 500: '#4E7A52', 600: '#3E6F4E', 800: '#284533' },
            yellow: { 300: '#E0C877', 900: '#4A3D1E' },
            amber: { 100: '#F5E8CF', 500: '#C29A4B', 700: '#97692C' },
            orange: { 500: '#CC7A3E', 600: '#B0652F', 700: '#925226' },
            blue: { 100: '#DFE9EF', 500: '#567A92', 600: '#41667D', 700: '#355367' },
            red: { 50: '#F9E7E0', 100: '#F5D4C8', 200: '#ECC2AF', 500: '#C05A36', 600: '#A84827', 700: '#8A3C22' },
          },
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <div id="header-placeholder"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <!-- MOBILE SEARCH -->
    <div class="md:hidden mb-6 flex gap-2">
      <input type="text" id="searchInputMobile" placeholder="Buscar produtos..." class="flex-1 px-4 py-3 bg-white border border-gray-200 rounded-xl text-sm focus:border-emerald-500">
      <button onclick="doSearchMobile()" class="px-5 bg-emerald-600 text-white rounded-xl font-semibold text-sm">Buscar</button>
    </div>

    <div class="flex gap-8">
      <!-- SIDEBAR -->
      <aside class="hidden lg:block w-64 shrink-0">
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100 sticky top-36">
          <h3 class="font-bold text-lg mb-5 flex items-center gap-2">
            <span class="w-8 h-8 bg-emerald-100 rounded-lg flex items-center justify-center"><i data-lucide="sliders-horizontal" class="w-4 h-4 text-emerald-700"></i></span>
            Filtros
          </h3>

          <div class="mb-5">
            <label class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 block">Categoria</label>
            <select id="filterCategory" onchange="applyFilters()" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
              <option value="Todos">Todas</option>
            </select>
          </div>

          <div class="mb-5">
            <label class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 block">Cidade</label>
            <select id="filterCity" onchange="applyFilters()" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm"></select>
          </div>

          <div class="mb-5">
            <label class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 block">Faixa de Preço</label>
            <div class="flex items-center gap-2">
              <input type="number" id="priceMin" placeholder="Mín" onchange="applyFilters()" class="w-1/2 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
              <span class="text-gray-400 text-xs">até</span>
              <input type="number" id="priceMax" placeholder="Máx" onchange="applyFilters()" class="w-1/2 px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
            </div>
          </div>

          <div class="mb-5">
            <label class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 block">Ordenar por</label>
            <select id="filterOrder" onchange="applyFilters()" class="w-full px-3 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm">
              <option value="relevant">Relevância</option>
              <option value="price-asc">Menor Preço</option>
              <option value="price-desc">Maior Preço</option>
              <option value="name">Nome A-Z</option>
            </select>
          </div>

          <div class="mb-4">
            <label class="flex items-center gap-3 cursor-pointer group">
              <input type="checkbox" id="filterPromo" onchange="applyFilters()" class="w-4 h-4 accent-emerald-600 rounded">
              <span class="text-sm text-gray-600 group-hover:text-gray-900 transition-colors">Apenas em promoção</span>
            </label>
          </div>
        </div>
      </aside>

      <!-- PRODUTOS -->
      <main class="flex-1 min-w-0">
        <div class="mb-6">
          <h1 class="text-2xl md:text-3xl font-extrabold" id="pageTitle">Catálogo de Produtos</h1>
          <p class="text-gray-500 mt-1" id="pageSubtitle">Todos os produtos artesanais do Vale do Itajaí</p>
        </div>

        <!-- MOBILE FILTERS -->
        <div class="lg:hidden mb-6 flex gap-3 overflow-x-auto pb-2">
          <select id="filterCategoryMobile" onchange="applyFiltersMobile()" class="px-4 py-2 bg-white border border-gray-200 rounded-xl text-sm font-medium shrink-0">
            <option value="Todos">Todas categorias</option>
          </select>
          <select id="filterCityMobile" onchange="applyFiltersMobile()" class="px-4 py-2 bg-white border border-gray-200 rounded-xl text-sm font-medium shrink-0"></select>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6" id="productsGrid"></div>
        <div class="hidden text-center py-20" id="emptyState">
          <div class="mb-4"><i data-lucide="search" class="w-14 h-14 mx-auto text-gray-300"></i></div>
          <h3 class="text-xl font-bold text-gray-700 mb-2">Nenhum produto encontrado</h3>
          <p class="text-gray-500">Tente ajustar os filtros ou buscar por outros termos.</p>
        </div>
      </main>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="../js/app.js"></script>
  <script>
    document.getElementById('header-placeholder').innerHTML = headerHTML('catalogo', '../');
    document.getElementById('footer-placeholder').innerHTML = footerHTML('../');

    const params = new URLSearchParams(window.location.search);
    const catParam = params.get('cat');
    const queryParam = params.get('q');

    // Preencher filtros
    const catSelect = document.getElementById('filterCategory');
    const catSelectMobile = document.getElementById('filterCategoryMobile');
    categories.forEach(c => {
      catSelect.innerHTML += `<option value="${c.name}">${c.name}</option>`;
      catSelectMobile.innerHTML += `<option value="${c.name}">${c.name}</option>`;
    });

    const citySelect = document.getElementById('filterCity');
    const citySelectMobile = document.getElementById('filterCityMobile');
    cities.forEach(c => {
      citySelect.innerHTML += `<option value="${c}">${c}</option>`;
      citySelectMobile.innerHTML += `<option value="${c}">${c}</option>`;
    });

    if (catParam) {
      catSelect.value = catParam;
      catSelectMobile.value = catParam;
      document.getElementById('pageTitle').textContent = catParam;
      document.getElementById('pageSubtitle').textContent = `Produtos da categoria ${catParam}`;
    }
    if (queryParam) {
      document.getElementById('searchInputMobile').value = queryParam;
      document.getElementById('pageTitle').textContent = `Resultados para "${queryParam}"`;
    }

    function applyFilters() {
      let filtered;
      if (queryParam && catSelect.value === 'Todos') {
        filtered = searchProducts(queryParam);
      } else {
        filtered = filterProducts(catSelect.value, citySelect.value, document.getElementById('priceMin').value, document.getElementById('priceMax').value);
      }
      if (document.getElementById('filterPromo').checked) filtered = filtered.filter(p => p.oldPrice);

      const order = document.getElementById('filterOrder').value;
      if (order === 'price-asc') filtered.sort((a, b) => a.price - b.price);
      else if (order === 'price-desc') filtered.sort((a, b) => b.price - a.price);
      else if (order === 'name') filtered.sort((a, b) => a.name.localeCompare(b.name));

      const grid = document.getElementById('productsGrid');
      const empty = document.getElementById('emptyState');
      if (filtered.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        grid.innerHTML = filtered.map(p => renderProductCard(p, '../')).join('');
      }
      if (window.lucide) lucide.createIcons();
    }

    function applyFiltersMobile() {
      catSelect.value = catSelectMobile.value;
      citySelect.value = citySelectMobile.value;
      applyFilters();
    }

    function doSearch() {
      const q = document.getElementById('searchInput').value;
      if (q.trim()) window.location.href = `catalogo.html?q=${encodeURIComponent(q)}`;
    }
    function doSearchMobile() {
      const q = document.getElementById('searchInputMobile').value;
      if (q.trim()) window.location.href = `catalogo.html?q=${encodeURIComponent(q)}`;
    }

    applyFilters();
  </script>
</body>
</html>
