<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — ValeVarejo Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            emerald: {
              50: '#F0F5F0', 100: '#E0E9DF', 200: '#C2D4BE', 300: '#99B392',
              400: '#6E946B', 500: '#4E7A52', 600: '#3E6F4E', 700: '#31563F',
              800: '#284533', 900: '#223829',
            },
            teal: { 400: '#5F9A8F', 500: '#4A8275', 600: '#39695E' },
            green: { 200: '#CBE0C6', 400: '#6E946B', 500: '#4E7A52', 600: '#3E6F4E', 800: '#284533' },
            yellow: { 300: '#E0C877', 900: '#4A3D1E' },
            amber: { 100: '#F5E8CF', 500: '#C29A4B', 700: '#97692C' },
            orange: { 500: '#CC7A3E', 600: '#B0652F', 700: '#925226' },
            blue: { 100: '#DFE9EF', 500: '#567A92', 600: '#41667D', 700: '#355367' },
            red: { 50: '#F9E7E0', 100: '#F5D4C8', 200: '#ECC2AF', 500: '#C05A36', 600: '#A84827', 700: '#8A3C22' },
          },
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
      <a href="../index.html" class="flex items-center gap-2.5">
        <div class="w-10 h-10 bg-emerald-600 rounded-lg flex items-center justify-center text-white font-black text-sm">VV</div>
        <span class="text-xl font-extrabold text-gray-900">Vale<span class="text-emerald-600">Varejo</span></span>
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <!-- LOGIN -->
      <div id="loginForm" class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center mx-auto mb-4"><i data-lucide="hand" class="w-8 h-8 text-emerald-700"></i></div>
          <h1 class="text-2xl font-extrabold">Bem-vindo de volta!</h1>
          <p class="text-gray-500 mt-2 text-sm">Entre na sua conta para continuar comprando</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
          <div>
            <label class="text-sm font-bold text-gray-700 mb-1.5 block">E-mail</label>
            <input type="email" id="loginEmail" placeholder="seu@email.com" required
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm transition-all">
          </div>
          <div>
            <label class="text-sm font-bold text-gray-700 mb-1.5 block">Senha</label>
            <input type="password" id="loginPassword" placeholder="Sua senha" required
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm transition-all">
          </div>
          <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition-all duration-300 active:scale-95">
            Entrar
          </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
          Não tem uma conta? <a href="#" onclick="showRegister()" class="text-emerald-600 font-bold hover:text-emerald-700">Cadastre-se</a>
        </p>

        <div class="mt-6 pt-6 border-t border-gray-100">
          <p class="text-center text-xs text-gray-400 mb-3">Área do Lojista</p>
          <button onclick="handleLojistaLogin()" class="w-full py-3 bg-gray-900 hover:bg-gray-800 text-white rounded-xl font-bold text-sm transition-all duration-300 active:scale-95 flex items-center justify-center gap-2">
            <i data-lucide="store" class="w-4 h-4"></i> Entrar como Lojista
          </button>
        </div>
      </div>

      <!-- CADASTRO -->
      <div id="registerForm" class="bg-white rounded-2xl p-8 shadow-sm border border-gray-100 hidden">
        <div class="text-center mb-8">
          <div class="w-16 h-16 bg-emerald-100 rounded-2xl flex items-center justify-center mx-auto mb-4"><i data-lucide="sparkles" class="w-8 h-8 text-emerald-700"></i></div>
          <h1 class="text-2xl font-extrabold">Crie sua conta</h1>
          <p class="text-gray-500 mt-2 text-sm">Cadastre-se para comprar produtos artesanais do Vale</p>
        </div>

        <form onsubmit="handleRegister(event)" class="space-y-4">
          <div>
            <label class="text-sm font-bold text-gray-700 mb-1.5 block">Nome completo</label>
            <input type="text" id="regName" placeholder="Seu nome" required
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm transition-all">
          </div>
          <div>
            <label class="text-sm font-bold text-gray-700 mb-1.5 block">E-mail</label>
            <input type="email" id="regEmail" placeholder="seu@email.com" required
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm transition-all">
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-sm font-bold text-gray-700 mb-1.5 block">Senha</label>
              <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6"
                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm transition-all">
            </div>
            <div>
              <label class="text-sm font-bold text-gray-700 mb-1.5 block">Confirmar</label>
              <input type="password" id="regConfirm" placeholder="Repita a senha" required
                class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm transition-all">
            </div>
          </div>
          <div>
            <label class="text-sm font-bold text-gray-700 mb-1.5 block">Telefone (opcional)</label>
            <input type="tel" id="regPhone" placeholder="(47) 99999-0000"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm transition-all">
          </div>
          <div>
            <label class="text-sm font-bold text-gray-700 mb-1.5 block">Cidade</label>
            <select id="regCity" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm transition-all">
              <option value="">Selecione sua cidade</option>
              <option>Blumenau</option>
              <option>Brusque</option>
              <option>Indaial</option>
              <option>Gaspar</option>
              <option>Itajaí</option>
              <option>Florianópolis</option>
              <option>Navegantes</option>
              <option>Timbó</option>
            </select>
          </div>
          <button type="submit" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold transition-all duration-300 active:scale-95">
            Criar Conta
          </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
          Já tem uma conta? <a href="#" onclick="showLogin()" class="text-emerald-600 font-bold hover:text-emerald-700">Entrar</a>
        </p>
      </div>
    </div>
  </main>

  <script src="../js/app.js"></script>
  <script>
    function showRegister() {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('registerForm').classList.remove('hidden');
    }
    function showLogin() {
      document.getElementById('loginForm').classList.remove('hidden');
      document.getElementById('registerForm').classList.add('hidden');
    }
    function handleLogin(e) {
      e.preventDefault();
      login(document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
      showToast('Login realizado com sucesso!');
      setTimeout(() => { window.location.href = '../index.html'; }, 1000);
    }
    function handleLojistaLogin() {
      loginLojista('lojista@valevarejo.com', '123456');
      showToast('Login de lojista realizado!');
      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
    }
    function handleRegister(e) {
      e.preventDefault();
      const pass = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirm').value;
      if (pass !== confirm) { showToast('As senhas não coincidem!'); return; }
      register(document.getElementById('regName').value, document.getElementById('regEmail').value, pass);
      showToast('Conta criada com sucesso!');
      setTimeout(() => { window.location.href = '../index.html'; }, 1000);
    }
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
