<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produto — ValeVarejo Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            emerald: {
              50: '#F0F5F0', 100: '#E0E9DF', 200: '#C2D4BE', 300: '#99B392',
              400: '#6E946B', 500: '#4E7A52', 600: '#3E6F4E', 700: '#31563F',
              800: '#284533', 900: '#223829',
            },
            teal: { 400: '#5F9A8F', 500: '#4A8275', 600: '#39695E' },
            green: { 200: '#CBE0C6', 400: '#6E946B', 500: '#4E7A52', 600: '#3E6F4E', 800: '#284533' },
            yellow: { 300: '#E0C877', 900: '#4A3D1E' },
            amber: { 100: '#F5E8CF', 500: '#C29A4B', 700: '#97692C' },
            orange: { 500: '#CC7A3E', 600: '#B0652F', 700: '#925226' },
            blue: { 100: '#DFE9EF', 500: '#567A92', 600: '#41667D', 700: '#355367' },
            red: { 50: '#F9E7E0', 100: '#F5D4C8', 200: '#ECC2AF', 500: '#C05A36', 600: '#A84827', 700: '#8A3C22' },
          },
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <div id="header-placeholder"></div>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="grid grid-cols-1 lg:grid-cols-2" id="productDetail"></div>
    </div>

    <section class="mt-12">
      <h2 class="text-2xl font-extrabold mb-6">Produtos da mesma loja</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6" id="relatedProducts"></div>
    </section>
  </div>

  <div id="footer-placeholder"></div>

  <script src="../js/app.js"></script>
  <script>
    document.getElementById('header-placeholder').innerHTML = headerHTML('', '../');
    document.getElementById('footer-placeholder').innerHTML = footerHTML('../');

    const params = new URLSearchParams(window.location.search);
    const productId = parseInt(params.get('id'));
    const allProducts = getAllProducts();
    const product = allProducts.find(p => p.id === productId);

    if (product) {
      const store = getStoreById(product.storeId);
      document.title = `${product.name} — ValeVarejo Digital`;

      document.getElementById('productDetail').innerHTML = `
        <div class="relative bg-gray-50 flex items-center justify-center text-[120px] min-h-[400px]">
          ${product.emoji}
          ${product.badge ? `<span class="absolute top-5 left-5 px-4 py-1.5 rounded-full text-sm font-bold text-white ${product.badge === 'Promoção' ? 'bg-red-500' : product.badge === 'Novidade' ? 'bg-blue-500' : 'bg-emerald-500'}">${product.badge}</span>` : ''}
          ${product.oldPrice ? `<span class="absolute top-5 right-5 px-3 py-1.5 rounded-xl text-sm font-bold text-white bg-orange-500">-${Math.round((1 - product.price/product.oldPrice) * 100)}%</span>` : ''}
        </div>
        <div class="p-8 lg:p-12">
          <nav class="flex items-center gap-2 text-sm text-gray-400 mb-6">
            <a href="../index.html" class="hover:text-emerald-600 transition-colors">Início</a>
            <span>/</span>
            <a href="catalogo.html?cat=${product.category}" class="hover:text-emerald-600 transition-colors">${product.category}</a>
            <span>/</span>
            <span class="text-gray-700">${product.name}</span>
          </nav>

          <h1 class="text-2xl lg:text-3xl font-extrabold mb-3">${product.name}</h1>

          <a href="loja.html?id=${store.id}" class="inline-flex items-center gap-2 text-emerald-600 font-semibold text-sm hover:text-emerald-700 mb-6 transition-colors">
            <span class="w-7 h-7 rounded-full bg-emerald-100 flex items-center justify-center text-xs">${store.name.charAt(0)}</span>
            ${store.name} · <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> ${store.location}
          </a>

          <div class="flex items-end gap-3 mb-6">
            <span class="text-4xl font-black text-emerald-700">${formatPrice(product.price)}</span>
            ${product.oldPrice ? `<span class="text-lg text-gray-400 line-through">${formatPrice(product.oldPrice)}</span>` : ''}
          </div>

          <p class="text-gray-600 leading-relaxed mb-8">${product.desc}</p>

          <div class="mb-6">
            <label class="text-sm font-bold text-gray-700 mb-3 block">Quantidade</label>
            <div class="inline-flex items-center bg-gray-100 rounded-xl p-1">
              <button onclick="changeQty(-1)" class="w-10 h-10 rounded-lg bg-white shadow-sm font-bold text-gray-700 hover:text-emerald-600 transition-colors">−</button>
              <span id="qty" class="w-12 text-center font-bold text-lg">1</span>
              <button onclick="changeQty(1)" class="w-10 h-10 rounded-lg bg-white shadow-sm font-bold text-gray-700 hover:text-emerald-600 transition-colors">+</button>
            </div>
          </div>

          <div class="mb-8">
            ${product.stock > 0
              ? `<span class="inline-flex items-center gap-2 text-sm font-medium text-emerald-700 bg-emerald-50 px-4 py-2 rounded-full">
                  <span class="w-2 h-2 bg-emerald-500 rounded-full"></span>
                  ${product.stock} unidades em estoque
                </span>`
              : `<span class="inline-flex items-center gap-2 text-sm font-medium text-red-700 bg-red-50 px-4 py-2 rounded-full">
                  <span class="w-2 h-2 bg-red-500 rounded-full"></span>
                  Indisponível
                </span>`
            }
          </div>

          <div class="flex flex-col sm:flex-row gap-3 mb-6">
            <button onclick="addQtyToCart()" class="flex-1 py-4 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-lg transition-all duration-300 active:scale-95 inline-flex items-center justify-center gap-2 ${product.stock <= 0 ? 'opacity-50 cursor-not-allowed' : ''}" ${product.stock <= 0 ? 'disabled' : ''}>
              <i data-lucide="shopping-cart" class="w-5 h-5"></i> Adicionar ao Carrinho
            </button>
          </div>

          ${store ? `
          <a href="https://wa.me/${store.whatsapp}?text=Olá! Vi o produto '${product.name}' no ValeVarejo e tenho interesse!" target="_blank" 
             class="flex items-center justify-center gap-3 w-full py-4 bg-[#25d366] hover:bg-[#1da851] text-white rounded-2xl font-bold transition-all duration-300 active:scale-95">
            <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Falar com ${store.owner} via WhatsApp
          </a>
          ` : ''}
        </div>
      `;

      let qty = 1;
      function changeQty(delta) {
        qty = Math.max(1, qty + delta);
        document.getElementById('qty').textContent = qty;
      }
      function addQtyToCart() {
        addToCart(product.id, qty);
      }

      // Relacionados
      const related = allProducts.filter(p => p.storeId === product.storeId && p.id !== product.id).slice(0, 4);
      const relatedGrid = document.getElementById('relatedProducts');
      if (related.length > 0) {
        related.forEach(p => { relatedGrid.innerHTML += renderProductCard(p, '../'); });
      } else {
        relatedGrid.parentElement.style.display = 'none';
      }
    } else {
      document.getElementById('productDetail').innerHTML = `
        <div class="col-span-full text-center py-20">
          <div class="mb-4"><i data-lucide="package-x" class="w-14 h-14 mx-auto text-gray-300"></i></div>
          <h3 class="text-xl font-bold text-gray-700 mb-2">Produto não encontrado</h3>
          <a href="catalogo.html" class="inline-flex mt-4 px-6 py-3 bg-emerald-600 text-white rounded-xl font-semibold hover:bg-emerald-700 transition-all">Ver Catálogo</a>
        </div>
      `;
    }

    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
